services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebright-dashboard-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kuala_Lumpur
    env_file:
      - ./backend/.env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Nginx Reverse Proxy with Frontend
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: ebright-dashboard-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl:/etc/nginx/ssl
    environment:
      - TZ=Asia/Kuala_Lumpur
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
