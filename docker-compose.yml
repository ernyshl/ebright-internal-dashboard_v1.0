
services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebright-dashboard-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kuala_Lumpur
      - CORS_ORIGIN=https://dashboard.ebright.my
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    networks:
      - app-network

  # Nginx Reverse Proxy with Frontend
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: ebright-dashboard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl:/etc/nginx/ssl
    environment:
      - TZ=Asia/Kuala_Lumpur
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge