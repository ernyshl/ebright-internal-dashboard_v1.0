name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.209.156.225
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "frontend,nginx,backend,docker-compose.yml"
          target: /home/deploy/apps/ebright-dashboard

      - name: Rebuild and restart Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.225
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /home/deploy/apps/ebright-dashboard
            docker compose down 2>/dev/null || docker-compose down || true
            docker compose build --no-cache nginx 2>/dev/null || docker-compose build --no-cache nginx
            docker compose up -d 2>/dev/null || docker-compose up -d
