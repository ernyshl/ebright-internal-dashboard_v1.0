name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.225
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # Locate the app directory
            APP_DIR=/home/deploy/apps/ebright-dashboard
            [ -d "$APP_DIR" ] || APP_DIR=/home/deploy/ebright-dashboard
            cd "$APP_DIR"
            # Pull latest code (reset avoids merge conflicts)
            git fetch --all
            git reset --hard origin/staging
            # Rebuild images and restart (support both old and new Docker CLI)
            docker compose up --build -d 2>/dev/null || docker-compose up --build -d
