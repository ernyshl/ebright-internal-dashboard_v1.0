name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.225
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # Step 1: deploy.sh handles git pull with correct auth
            /home/deploy/deploy.sh dashboard
            # Step 2: Find app dir, tear down old containers, then rebuild fresh
            APP_DIR=/home/deploy/apps/ebright-dashboard
            [ -d "$APP_DIR" ] || APP_DIR=/home/deploy/ebright-dashboard
            cd "$APP_DIR"
            docker compose down 2>/dev/null || docker-compose down
            docker compose up --build -d 2>/dev/null || docker-compose up --build -d
