name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.174
          username: staff1
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          script: |
            /home/staff1/deploy-prod.sh dashboard
            # Ensure CORS is correct after every deploy
            find /home/staff1 -name ".env" -path "*/backend*" 2>/dev/null | while read f; do
              if grep -q "CORS_ORIGIN" "$f"; then
                sed -i 's|CORS_ORIGIN=.*|CORS_ORIGIN=https://dashboard.ebright.my|' "$f"
              else
                echo "CORS_ORIGIN=https://dashboard.ebright.my" >> "$f"
              fi
            done
            docker compose restart backend 2>/dev/null || docker-compose restart backend 2>/dev/null || true
