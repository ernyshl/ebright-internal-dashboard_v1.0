name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.174
          username: staff1
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          script: |
            /home/staff1/deploy-prod.sh dashboard
            # Patch env vars
            for f in $(find /home/staff1 -name ".env" 2>/dev/null); do
              grep -q "CORS_ORIGIN" "$f" && sed -i 's|CORS_ORIGIN=.*|CORS_ORIGIN=https://dashboard.ebright.my|' "$f" || echo "CORS_ORIGIN=https://dashboard.ebright.my" >> "$f"
              grep -q "NODE_ENV" "$f" && sed -i 's|NODE_ENV=.*|NODE_ENV=production|' "$f" || echo "NODE_ENV=production" >> "$f"
            done
            # Rebuild backend with new code then restart all services
            for dir in $(find /home/staff1 -name "docker-compose.yml" -exec dirname {} \; 2>/dev/null); do
              cd "$dir"
              docker compose build --no-cache backend 2>/dev/null || docker-compose build --no-cache backend 2>/dev/null || true
              docker compose up -d 2>/dev/null || docker-compose up -d 2>/dev/null || true
            done
