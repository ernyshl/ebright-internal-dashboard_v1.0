name: Fix Production CORS + Restart Backend

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose, patch CORS, restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.174
          username: staff1
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "=== Docker containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || true

            echo "=== Finding app directory ==="
            find /home/staff1 -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null | head -5

            echo "=== Finding .env files ==="
            find /home/staff1 -name ".env" 2>/dev/null

            echo "=== Patching CORS + NODE_ENV in all .env files ==="
            for f in $(find /home/staff1 -name ".env" 2>/dev/null); do
              echo "--- $f ---"
              cat "$f" | grep -iE "cors|node_env" || echo "(no CORS/NODE_ENV line)"

              # Patch CORS_ORIGIN
              if grep -q "CORS_ORIGIN" "$f"; then
                sed -i 's|CORS_ORIGIN=.*|CORS_ORIGIN=https://dashboard.ebright.my|' "$f"
              else
                echo "CORS_ORIGIN=https://dashboard.ebright.my" >> "$f"
              fi

              # Patch NODE_ENV — must be 'production' for CORS to allow non-localhost origins
              if grep -q "NODE_ENV" "$f"; then
                sed -i 's|NODE_ENV=.*|NODE_ENV=production|' "$f"
              else
                echo "NODE_ENV=production" >> "$f"
              fi

              echo "After patch:"
              grep -iE "cors|node_env" "$f"
            done

            echo "=== Restarting all running backend containers ==="
            for name in $(docker ps --format "{{.Names}}" 2>/dev/null | grep -i back); do
              echo "Restarting container: $name"
              docker restart "$name" || true
            done
            # Also try by compose file location
            for dir in $(find /home/staff1 -name "docker-compose.yml" -exec dirname {} \; 2>/dev/null); do
              echo "Trying compose restart in $dir"
              cd "$dir"
              docker compose restart backend 2>/dev/null || docker-compose restart backend 2>/dev/null || true
            done

            echo "=== Done ==="
