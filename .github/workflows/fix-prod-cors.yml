name: Fix Production CORS + Restart Backend

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix backend on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.209.156.174
          username: staff1
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /home/staff1/ebright-dashboard
            git checkout backend/src/app.js
            git pull origin master
            grep -q "CORS_ORIGIN" backend/.env && sed -i 's|CORS_ORIGIN=.*|CORS_ORIGIN=https://dashboard.ebright.my|' backend/.env || echo "CORS_ORIGIN=https://dashboard.ebright.my" >> backend/.env
            grep -q "NODE_ENV" backend/.env && sed -i 's|NODE_ENV=.*|NODE_ENV=production|' backend/.env || echo "NODE_ENV=production" >> backend/.env
            docker compose stop backend
            docker compose rm -f backend
            docker compose build --no-cache backend
            docker compose up -d
            sleep 5
            docker ps
